<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Piano Tuner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;background:#111;color:#eee;text-align:center;padding:12px}
button,input,select{font-size:20px;padding:8px 14px;margin:4px;border-radius:10px;border:0}
button{background:#333;color:#eee}.pre{font-size:16px;padding:6px 10px}.on{background:#2a6}
#target{font-size:72px;font-weight:bold;margin:4px}#info{font-size:20px;min-height:28px}canvas{max-width:100%}
.box{background:#1c1c1c;border-radius:12px;padding:8px;margin:8px auto;max-width:480px}
</style></head><body>
<h2>Piano Tuner</h2>
<div class="box">Piano: <select id="prof"></select>
 <button id="newp" class="pre">New</button><button id="renp" class="pre">Rename</button><button id="delp" class="pre">Delete</button></div>
<div class="box">A4 = <input id="ref" type="number" step="0.1" style="width:100px"> Hz<div id="presets"></div>
 Stretch: <input id="str" type="range" min="0" max="150" step="5"> <span id="strv"></span>
 <div>Partial: <select id="part"><option value="auto">Auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div>
<div><button id="prev">◀</button><span id="target">A4</span><button id="next">▶</button></div>
<div id="tf"></div>
<canvas id="dial" width="400" height="230"></canvas>
<div id="info">Tap "Start listening"</div>
<button id="listen">🎤 Start listening</button><button id="play">🔊 Play</button><button id="stop">Stop</button>
<div><label><input type="checkbox" id="auto"> Auto-advance when in tune</label></div>
<script>
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const $=id=>document.getElementById(id);
let profiles=JSON.parse(localStorage.getItem('tunerProfiles')||'{}');
if(!Object.keys(profiles).length)profiles={'My piano':{ref:440,stretch:100,partial:'auto'}};
let cur=localStorage.getItem('tunerCur');if(!profiles[cur])cur=Object.keys(profiles)[0];
let tgt=69,ctx,osc,shown=0,okSince=0;
const ref=()=>+$('ref').value||440;
const name=m=>N[m%12]+(Math.floor(m/12)-1);
function stretchCents(m){const s=+$('str').value/100;
 return m>=69? s*30*Math.pow((m-69)/39,2) : -s*25*Math.pow((69-m)/48,2)}
const freqOf=m=>ref()*Math.pow(2,(m-69)/12+stretchCents(m)/1200);
const partialN=m=>$('part').value!=='auto'?+$('part').value:(m<=33?3:m<=45?2:1);
function save(){profiles[cur]={ref:ref(),stretch:+$('str').value,partial:$('part').value};
 localStorage.setItem('tunerProfiles',JSON.stringify(profiles));localStorage.setItem('tunerCur',cur)}
function fillProfiles(){const p=$('prof');p.innerHTML='';
 Object.keys(profiles).forEach(k=>p.add(new Option(k,k,false,k===cur)))}
function load(){const p=profiles[cur];$('ref').value=p.ref;$('str').value=p.stretch;$('part').value=p.partial;refresh()}
function refresh(){$('strv').textContent=$('str').value+'%';
 [...$('presets').children].forEach(b=>b.classList.toggle('on',+b.textContent==ref()));setT(tgt)}
function changed(){save();refresh()}
[415,432,435,440,442,443,444].forEach(v=>{const b=document.createElement('button');
 b.className='pre';b.textContent=v;b.onclick=()=>{$('ref').value=v;changed()};$('presets').appendChild(b)});
$('ref').oninput=changed;$('str').oninput=changed;$('part').onchange=changed;
$('prof').onchange=()=>{cur=$('prof').value;localStorage.setItem('tunerCur',cur);load()};
$('newp').onclick=()=>{const n=prompt('Name of the piano:');if(!n)return;
 profiles[n]={ref:440,stretch:100,partial:'auto'};cur=n;save();fillProfiles();load()};
$('renp').onclick=()=>{const n=prompt('New name:',cur);if(!n||profiles[n])return;
 profiles[n]=profiles[cur];delete profiles[cur];cur=n;save();fillProfiles()};
$('delp').onclick=()=>{if(Object.keys(profiles).length<2||!confirm('Delete '+cur+'?'))return;
 delete profiles[cur];cur=Object.keys(profiles)[0];save();fillProfiles();load()};
function setT(m){tgt=Math.max(21,Math.min(108,m));$('target').textContent=name(tgt);
 const sc=stretchCents(tgt),n=partialN(tgt);
 $('tf').textContent='Target '+freqOf(tgt).toFixed(2)+' Hz'+(Math.abs(sc)>=0.5?' (stretch '+(sc>0?'+':'')+sc.toFixed(1)+' c)':'')+
  (n>1?' · listening to partial '+n:'');okSince=0;if(osc)$('play').onclick()}
$('prev').onclick=()=>setT(tgt-1);$('next').onclick=()=>setT(tgt+1);
const ac=()=>ctx||(ctx=new AudioContext());
$('play').onclick=()=>{$('stop').onclick();const c=ac();osc=c.createOscillator();const g=c.createGain();
 g.gain.value=0.3;osc.frequency.value=freqOf(tgt);osc.connect(g).connect(c.destination);osc.start()};
$('stop').onclick=()=>{if(osc){osc.stop();osc=null}};
function draw(c,active){const x=$('dial').getContext('2d'),cx=200,cy=210,R=180;
 x.clearRect(0,0,400,230);x.lineWidth=18;
 [[-50,-10,'#c33'],[-10,-3,'#ca3'],[-3,3,'#2c4'],[3,10,'#ca3'],[10,50,'#c33']].forEach(([a,b,col])=>{
  x.strokeStyle=col;x.beginPath();x.arc(cx,cy,R,Math.PI+(a+50)/100*Math.PI,Math.PI+(b+50)/100*Math.PI);x.stroke()});
 x.fillStyle='#aaa';x.font='16px sans-serif';x.textAlign='center';
 for(let t=-50;t<=50;t+=10){const an=Math.PI+(t+50)/100*Math.PI;
  x.fillText(t>0?'+'+t:t,cx+(R-35)*Math.cos(an),cy+(R-35)*Math.sin(an)+5)}
 const cl=Math.max(-50,Math.min(50,c)),an=Math.PI+(cl+50)/100*Math.PI;
 x.strokeStyle=active?(Math.abs(c)<=3?'#2f4':'#fff'):'#555';x.lineWidth=5;
 x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+(R-10)*Math.cos(an),cy+(R-10)*Math.sin(an));x.stroke();
 x.fillStyle='#eee';x.beginPath();x.arc(cx,cy,10,0,7);x.fill()}
// look for the chosen partial within about +/-1 semitone of where it should be
function detect(b,sr,fexp){let e=0;for(const v of b)e+=v*v;if(Math.sqrt(e/b.length)<0.01)return -1;
 const T=sr/fexp,lo=Math.max(2,Math.floor(T*0.94)),hi=Math.ceil(T*1.06),n=b.length-hi-1;
 if(n<200)return -1;let e0=0;for(let i=0;i<n;i++)e0+=b[i]*b[i];
 const c={};let best=-1,bv=-1;
 for(let l=lo-1;l<=hi+1;l++){let s=0,e1=0;for(let i=0;i<n;i++){s+=b[i]*b[i+l];e1+=b[i+l]*b[i+l]}
  c[l]=s/Math.sqrt(e0*e1+1e-12);if(l>=lo&&l<=hi&&c[l]>bv){bv=c[l];best=l}}
 if(bv<0.5||best<=lo||best>=hi)return -1;
 const a=c[best-1],m=c[best],g=c[best+1],sh=(a-g)/(2*(a-2*m+g))||0;return sr/(best+sh)}
$('listen').onclick=async()=>{const c=ac();await c.resume();
 const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 const an=c.createAnalyser();an.fftSize=8192;c.createMediaStreamSource(s).connect(an);
 const buf=new Float32Array(an.fftSize);$('listen').disabled=true;
 (function loop(){an.getFloatTimeDomainData(buf);const n=partialN(tgt),fexp=n*freqOf(tgt);
  const p=detect(buf,c.sampleRate,fexp);
  if(p>0){const cents=1200*Math.log2(p/fexp);shown+=(cents-shown)*0.3;const r=Math.round(shown);
   $('info').textContent=(p/n).toFixed(2)+' Hz · '+(r>0?'+':'')+r+' cents · '+
    (Math.abs(r)<=3?'✔ IN TUNE':r>0?'too sharp – loosen':'too flat – tighten');
   draw(shown,true);
   if(Math.abs(r)<=3){okSince=okSince||performance.now();
    if($('auto').checked&&performance.now()-okSince>1000)setT(tgt+1)}else okSince=0;
  }else draw(shown,false);
  requestAnimationFrame(loop)})()};
fillProfiles();load();draw(0,false);
</script></body></html>
